name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_ref:
        description: API-SaudeMais commit, branch or tag to test against (empty uses the pinned commit)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saudemais_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d saudemais_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VITE_API_URL: http://localhost:3001
      ADMIN_EMAIL: admin@e2e.test
      API_REF: ${{ inputs.api_ref || '1f3b56ed42db18e09323ee77d328d44ebaa910e6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Plovatto/API-SaudeMais
          ref: ${{ env.API_REF }}
          path: api
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: generate a throwaway admin password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: seed and start the API
        working-directory: api
        env:
          NODE_ENV: development
          PORT: 3001
          LOG_LEVEL: warn
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saudemais_e2e
          CORS_ORIGIN: http://localhost:4173
          TRUST_PROXY_HOPS: 0
          APP_PUBLIC_URL: http://localhost:4173/SaudeMais
          MAIL_DRIVER: console
          DEMO_ACCOUNTS_ENABLED: true
        run: |
          npm ci
          npm run db:seed
          npm run build
          nohup npm start > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:3001/health && exit 0
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - name: API logs
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 3
