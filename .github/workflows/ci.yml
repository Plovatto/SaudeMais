name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    env:
      VITE_API_URL: https://saudemais-api.plovatto.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: check the API types match the contract
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: check the static hosting output
        run: |
          grep -q 'name="robots" content="noindex, nofollow"' dist/404.html
          grep -q 'src="/assets/' dist/404.html
          for page in login cadastro termos privacidade; do
            grep -q "rel=\"canonical\" href=\"https://saudemais.plovatto.dev/$page\"" "dist/$page.html"
          done
          head -c 300 dist/index.html | grep -q 'http-equiv="Content-Security-Policy"'
          grep -q 'src="/assets/' dist/index.html
      - run: npm audit --omit=dev --audit-level=moderate
